# Dependabot — PRs automáticos de atualização (patch/minor) com as mudanças já testadas pelo CI.
# Cobre: GitHub Actions (versões/SHA), dependências Python e a imagem base do Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /                      # app (requirements.txt)
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      serving:                        # minor/patch num PR só; majors (ex.: gunicorn) ficam em PRs individuais
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:                           # TF nunca por aqui (ADR 0002); numpy daqui só vale p/ o serving (requirements.txt)
      - dependency-name: tensorflow-cpu
      - dependency-name: tensorflow

  - package-ecosystem: pip
    directory: /pipeline              # pipeline (requirements*.txt)
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(pipeline)
    ignore:                           # (só version updates; alertas de segurança seguem abrindo PR)
      # DECISÃO ARQUITETURAL (ADR 0002): o toolchain canônico do refresh (Py 3.12 + TF 2.18 + numpy<2.2)
      # só muda manualmente, após o comparativo 0.8. Nunca por bump automático.
      - dependency-name: tensorflow-cpu
      - dependency-name: tensorflow
      - dependency-name: numpy

  - package-ecosystem: pip
    directory: /tests                 # testes (requirements.txt)
    schedule:
      interval: monthly
    labels: [dependencies]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(tests)
    ignore:
      - dependency-name: tensorflow-cpu
      - dependency-name: tensorflow

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
