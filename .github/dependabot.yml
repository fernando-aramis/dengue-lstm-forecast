# Dependabot — PRs automáticos de atualização (patch/minor) com as mudanças já testadas pelo CI.
# Cobre: GitHub Actions (versões/SHA), dependências Python e a imagem base do Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /                      # app (requirements.txt)
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      serving:                        # um PR só para o serving (o lock é regerado junto; ver test_lock_sincronizado)
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /pipeline              # pipeline (requirements*.txt)
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(pipeline)
    ignore:                           # toolchain canônico (Py 3.12 + TF 2.18) só muda manualmente (tarefa 0.8)
      - dependency-name: tensorflow-cpu
      - dependency-name: numpy

  - package-ecosystem: pip
    directory: /tests                 # testes (requirements.txt)
    schedule:
      interval: monthly
    commit-message:
      prefix: deps(tests)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
