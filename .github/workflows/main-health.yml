# Vigia da main (Q.1): push do GITHUB_TOKEN (refresh/heartbeat) não dispara o CI, e testes podem
# envelhecer com os dados. Roda a suíte completa na main e abre/atualiza uma issue se falhar;
# fecha a issue quando voltar a verde. Não substitui o heartbeat do refresh.
name: main-health

on:
  schedule:
    - cron: "30 10 * * 1"   # segunda, ~1 h após o refresh (09:00 UTC)
    - cron: "30 10 * * 4"   # quinta
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref a testar (padrão: main). Use uma branch de teste para provocar falha."
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - run: pip install -r requirements.txt -r tests/requirements.txt
      - name: Playwright (deps de SO + browser)
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium
      - run: pytest tests/ -q

  reportar:
    needs: suite
    if: always() && needs.suite.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write            # só este job escreve issues
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITULO: "CI da main vermelho"
      RESULTADO: ${{ needs.suite.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Abrir/atualizar ou fechar a issue
        run: |
          n=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number,title \
              --jq "map(select(.title==\"$TITULO\"))[0].number // empty")
          if [ "$RESULTADO" = "success" ]; then
            [ -n "$n" ] && gh issue close "$n" --comment "Voltou a verde: $RUN_URL"
            exit 0
          fi
          corpo="A suíte (unit + E2E + axe) falhou na main. Execução: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$corpo"
          else
            gh issue create --title "$TITULO" --body "$corpo"
          fi
