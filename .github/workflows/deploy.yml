# Deploy — publica o app no Hugging Face Space a cada push em main (GitHub Flow: main = produção).
# INERTE até o projeto ir para o GitHub. Mecanismo: git push para o remote do Space (SDK Docker).
#
# PRÉ-REQUISITOS (configurar no repositório GitHub, uma vez):
#   • Secret   HF_TOKEN  = token do Hugging Face com permissão de escrita (Settings → Tokens)
#   • Variable HF_SPACE  = "usuario/nome-do-space" (ex.: fernando/dengue-curitiba)
#   • O README.md tem o cabeçalho YAML do Space (sdk: docker, app_port: 7860) — já incluído.
name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca cancela um deploy em andamento; enfileira o próximo.
concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0            # o push para o Space precisa do histórico completo

      # Gate rápido: nunca publica um main quebrado (vale até p/ push direto que burlou o PR).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - run: pip install -r requirements.txt -r tests/requirements.txt
      - name: Gate de fumaça (testes unitários + contrato dos dados)
        run: pytest tests/test_unit.py -q

      - name: Publicar no Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::defina o secret HF_TOKEN"; exit 1; }
          test -n "$HF_SPACE" || { echo "::error::defina a variable HF_SPACE (usuario/space)"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # auth via token na URL; 'api' é um usuário fictício aceito pelo HF quando há token
          git remote add space "https://api:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" 2>/dev/null \
            || git remote set-url space "https://api:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git"
          # força o estado do Space = main (o Space é um espelho de deploy, não recebe commits próprios)
          git push --force space HEAD:main
          echo "✅ publicado em https://huggingface.co/spaces/${HF_SPACE}"
