# CI — roda os testes a cada PR/push em main (GitHub Flow).
# Pressupõe que a raiz do repositório é a pasta webapp/. Se o repo for a pasta-mãe
# (dengue-curitiba/), mova este .github/ para lá e prefixe os passos com
# `working-directory: webapp` (e ajuste cache-dependency-path).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: o CI só precisa ler o código (OWASP/hardening do GITHUB_TOKEN).
permissions:
  contents: read

# Economia: um novo push na mesma branch/PR cancela a execução anterior ainda em andamento.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # só `ruff check` (sem `ruff format`); versão pinada em requirements-dev.txt
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = produção (Docker/HF Spaces) · 3.14 = ambiente de dev local (pins novíssimos).
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                       # cacheia o diretório de wheels do pip entre runs
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - run: pip install -r requirements.txt -r tests/requirements.txt
      # unit = tudo que não abre navegador (contratos, formato, i18n/validações, estado sem cobertura)
      - run: pytest tests/test_unit.py tests/test_formato.py tests/test_i18n_validacoes.py tests/test_sem_cobertura.py -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - run: pip install -r requirements.txt -r tests/requirements.txt
      # Cacheia o BROWSER do Playwright (~130 MB) por versão; as libs de SO (apt) não são cacheáveis.
      - name: Cache Playwright browser
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - name: Playwright system deps (apt)
        run: python -m playwright install-deps chromium
      - name: Playwright browser (baixa só no cache-miss)
        if: steps.pw.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      # E2E + axe-core AAA (tests/vendor/axe.min.js, vendorizado: sem CDN)
      - run: pytest tests/test_e2e.py tests/test_a11y_axe.py -q
      # Sobe os screenshots SÓ quando o E2E falha — debug de flaky sem reexecutar localmente.
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # Qualidade de design (impeccable detect): NÃO bloqueia o merge — só informa. Hoje só há 'advisory'
  # (tipografia/cor fora do DESIGN.md); um antipadrão de severidade maior aparece como anotação no PR.
  # Versão FIXADA (supply-chain); o launcher do skill não está neste repo, então usamos o pacote npm.
  design-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: impeccable detect (anotações no PR)
        run: npx --yes impeccable@4.9.1 detect --github assets layout.py figuras.py || true
      - name: impeccable detect (JSON + resumo)
        run: |
          npx --yes impeccable@4.9.1 detect --json assets layout.py figuras.py > detect.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          d = json.load(open("detect.json"))
          c = collections.Counter((x.get("antipattern"), x.get("severity")) for x in d)
          print(f"### impeccable detect — {len(d)} achado(s)\n")
          print("| regra | severidade | n |\n|---|---|---|")
          for (r, sv), n in c.most_common():
              print(f"| {r} | {sv} | {n} |")
          PY
      - name: Upload detect.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impeccable-detect-${{ github.run_id }}
          path: detect.json
          if-no-files-found: ignore
          retention-days: 14
