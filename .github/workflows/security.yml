# Segurança — scan contínuo de CVEs + SAST + lint do Dockerfile + scan da imagem.
# INERTE até o projeto ir para o GitHub. Pressupõe que a raiz do repositório é a pasta webapp/.
#
# GATE: os jobs FALHAM em CVE HIGH/CRITICAL com correção disponível e em achados de SAST (MEDIUM+),
# bloqueando o merge até resolver. CVEs sem correção (will_not_fix) são ignorados (--ignore-unfixed).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # toda segunda, 06:00 UTC — pega CVEs novos na base pinada ao longo do tempo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CVEs em TODAS as dependências declaradas (app + pipeline + testes)
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: pip-audit (app · pipeline · testes)
        run: |
          pip-audit -r requirements.txt --desc
          pip-audit -r tests/requirements.txt --desc
          # pipeline: só avisa (não bloqueia o merge) — TF tem CVEs frequentes e NÃO entra na imagem
          # de serving; o gate duro fica no requirements.txt (o que de fato é publicado).
          pip-audit -r pipeline/requirements.txt --desc || echo "::warning::CVE(s) em pipeline/requirements.txt (não-bloqueante)"

  # Segredos no HISTÓRICO do git (complementa o scanner `secret` do Trivy, que só olha a imagem
  # buildada — não os commits antigos). fetch-depth: 0 traz todo o histórico para a varredura.
  # gitleaks é FREE para repositórios públicos / contas pessoais; GITLEAKS_LICENSE só é exigido
  # em repositórios de ORGANIZAÇÃO. Falha o job (bloqueia o merge) se achar um segredo.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST do código Python (falha em MEDIUM+). Exclui venv e testes.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit
      - run: bandit -r . -x ./.venv,./tests -ll

  # Lint do Dockerfile (só erros quebram; DL3066/DL3025 são info/warning)
  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # CVEs da imagem (SO + libs) + segredos vazados. Build com cache de camadas (GHA) p/ economia.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build da imagem (cache de camadas no GitHub Actions)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dengue-webapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (gate HIGH/CRITICAL corrigível + segredos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dengue-webapp:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore    # falsos-positivos documentados (ver o arquivo)
      - name: Gerar SBOM (CycloneDX) da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dengue-webapp:ci
          scan-type: image
          format: cyclonedx
          output: sbom.cdx.json
      - name: Publicar o SBOM como artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
